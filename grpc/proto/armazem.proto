// Contrato (IDL), neutro de linguagem: qualquer linguagem com protoc gera stubs a partir dele.
// Servidor e cliente (Python) são gerados a partir deste mesmo arquivo.
syntax = "proto3";

package armazem;

enum Categoria {
  CATEGORIA_DESCONHECIDA = 0;
  ELETRONICOS = 1;
  LIVROS = 2;
  ALIMENTOS = 3;
}

message Produto {
  int32 id = 1;
  string nome = 2;
  Categoria categoria = 3;
  double preco = 4;
  int32 estoque = 5;
  repeated string tags = 6;
}

message ProdutoRequest { int32 id = 1; }

message FiltroRequest {
  Categoria categoria = 1;   // CATEGORIA_DESCONHECIDA = sem filtro
  double preco_max = 2;      // 0 = sem filtro
}

message ResumoImportacao {
  int32 recebidos = 1;
  int32 novos = 2;
  int32 atualizados = 3;
  int32 rejeitados = 4;
}

message Oferta {
  int32 produto_id = 1;
  double valor = 2;
}

message Contraoferta {
  bool aceita = 1;
  double valor = 2;
  string mensagem = 3;
}

message LentaRequest { int32 segundos = 1; }
message LentaReply { string mensagem = 1; }

service Armazem {
  // 1) Unário: 1 requisição -> 1 resposta
  rpc ConsultarProduto (ProdutoRequest) returns (Produto);

  // 2) Server streaming: 1 requisição -> N respostas
  rpc ListarProdutos (FiltroRequest) returns (stream Produto);

  // 3) Client streaming: N requisições -> 1 resposta
  rpc ImportarProdutos (stream Produto) returns (ResumoImportacao);

  // 4) Bidirecional: N requisições <-> N respostas, simultâneas
  rpc Negociar (stream Oferta) returns (stream Contraoferta);

  // Usada para demonstrar deadline/timeout
  rpc OperacaoLenta (LentaRequest) returns (LentaReply);
}
